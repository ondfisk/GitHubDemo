---
name: Lint

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read # Required for Super-Linter
      issues: write # Required for Super-Linter
      pull-requests: write # Required for Super-Linter
      statuses: write # Required for Super-Linter

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: true
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_BIOME_FORMAT: true
          VALIDATE_BIOME_LINT: true
          VALIDATE_CHECKOV: true
          VALIDATE_CSHARP: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_DOTNET_SLN_FORMAT_ANALYZERS: true
          VALIDATE_DOTNET_SLN_FORMAT_STYLE: true
          VALIDATE_DOTNET_SLN_FORMAT_WHITESPACE: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JSCPD: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_SHELL_SHFMT: true
